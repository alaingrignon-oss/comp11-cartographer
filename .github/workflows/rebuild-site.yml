name: rebuild-site

on:
  push:
    paths:
      - "explorer/*.json"
      - "build_site.py"
      - "site/template.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify map gates before publishing
        run: python3 package/engine/verify_map.py

      - name: Rebuild static site from evidence ledgers
        run: python3 build_site.py

      - name: Commit rebuilt page if changed
        run: |
          if git diff --quiet docs/index.html; then
            echo "Site already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "rebuild-site: regenerate index.html from evidence ledgers"
            git push
          fi
